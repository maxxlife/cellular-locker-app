# Enable Partition Manager
CONFIG_PARTITION_MANAGER_ENABLED=y
# Enable Trusted Execution
CONFIG_TRUSTED_EXECUTION_NONSECURE=y

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_NATIVE=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y

# Modem library
CONFIG_NRF_MODEM_LIB=y
CONFIG_LTE_LINK_CONTROL=y

# Modem networking wrapper
CONFIG_NET_SOCKETS_OFFLOAD=y

# HTTP Server
CONFIG_HTTP_SERVER=y

# GPIO
CONFIG_GPIO=y

# Logging
CONFIG_LOG=y
CONFIG_LTE_LINK_CONTROL_LOG_LEVEL_INF=y
CONFIG_NRF_MODEM_LIB_NET_IF=y
CONFIG_NET_LOG=y

# Heap and memory
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# PDN management
CONFIG_PDN=y
CONFIG_PDN_DEFAULTS_OVERRIDE=y
CONFIG_PDN_DEFAULT_APN="onomondo"

# === STEP 4 ADDITIONS: SMS & Power Management ===
CONFIG_PM_DEVICE=y

# SMS Config
CONFIG_SMS=y
CONFIG_SMS_SUBSCRIBERS_MAX_CNT=1

# Modem PSM Config (1 Hour TAU, 0s Active Time)
CONFIG_LTE_PSM_REQ=y
CONFIG_LTE_PSM_REQ_RPTAU="00100001"
CONFIG_LTE_PSM_REQ_RAT="00000000"

# Modem eDRX Config (10.24 seconds paging cycle)
CONFIG_LTE_EDRX_REQ=y
CONFIG_LTE_EDRX_REQ_VALUE_LTE_M="0001"

CONFIG_REBOOT=y